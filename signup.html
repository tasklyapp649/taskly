<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer un compte — Taskly</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #15171c;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .logo span {
      color: #635bff;
    }

    .card {
      background: white;
      border: 1px solid #e5e6eb;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(25,25,40,0.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      color: #70737c;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dfe1e7;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #635bff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #635bff;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #70737c;
      font-size: 14px;
    }

    .login a {
      color: #635bff;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #70737c;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      task<span>ly</span>
    </div>

    <div class="card">

      <h1>Créer ton compte</h1>

      <p class="description">
        Crée ton compte gratuitement et commence à transformer
        tes objectifs en actions.
      </p>

      <form id="signupForm">

        <label for="name">Prénom</label>

        <input
          id="name"
          type="text"
          placeholder="Ton prénom"
          required
        >

        <label for="email">Adresse e-mail</label>

        <input
          id="email"
          type="email"
          placeholder="ton@email.com"
          required
        >

        <label for="password">Mot de passe</label>

        <input
          id="password"
          type="password"
          placeholder="Au moins 8 caractères"
          minlength="8"
          required
        >

        <button type="submit">
          Créer mon compte gratuitement
        </button>

      </form>

      <div class="login">
        Tu as déjà un compte ?
        <a href="login.html">Se connecter</a>
      </div>

      <a href="index.html" class="back">
        ← Retour à Taskly
      </a>

    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- Inscription Taskly -->
  <script>

    const form = document.getElementById("signupForm");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (password.length < 8) {

        alert(
          "Le mot de passe doit contenir au moins 8 caractères."
        );

        return;
      }

      const button =
        form.querySelector("button");

      button.disabled = true;

      button.textContent =
        "Création du compte...";

      try {

        const result =
          await window.tasklySupabase.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                first_name: name
              }
            }

          });

        if (result.error) {

          alert(
            "Erreur : " +
            result.error.message
          );

          button.disabled = false;

          button.textContent =
            "Créer mon compte gratuitement";

          return;
        }

        alert(
          "Compte créé ! Vérifie ton adresse e-mail."
        );

        window.location.href =
          "login.html";

      } catch (error) {

        alert(
          "Erreur inattendue : " +
          error.message
        );

        button.disabled = false;

        button.textContent =
          "Créer mon compte gratuitement";
      }

    });

  </script>

</body>
</html>
