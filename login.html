<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion — Taskly</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #15171c;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: -1px;
    }

    .logo span {
      color: #635bff;
    }

    .card {
      background: white;
      border: 1px solid #e5e6eb;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(25, 25, 40, 0.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      color: #70737c;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dfe1e7;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #635bff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: #635bff;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
      color: #635bff;
      text-decoration: none;
      font-size: 13px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #70737c;
      font-size: 14px;
    }

    .signup a {
      color: #635bff;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #70737c;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #eefbf3;
      color: #16794c;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      task<span>ly</span>
    </div>

    <div class="card">

      <h1>Bon retour 👋</h1>

      <p class="description">
        Connecte-toi à ton compte Taskly pour retrouver
        tes objectifs et ta progression.
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <label for="email">
          Adresse e-mail
        </label>

        <input
          id="email"
          type="email"
          placeholder="ton@email.com"
          autocomplete="email"
          required
        >

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          placeholder="Ton mot de passe"
          autocomplete="current-password"
          required
        >

        <a href="#" id="forgotPassword" class="forgot">
          Mot de passe oublié ?
        </a>

        <button id="loginButton" type="submit">
          Se connecter
        </button>

      </form>

      <div class="signup">
        Pas encore de compte ?
        <a href="signup.html">
          Créer un compte
        </a>
      </div>

      <a href="index.html" class="back">
        ← Retour à Taskly
      </a>

    </div>

  </div>


  <!-- Bibliothèque Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration Taskly -->
  <script src="supabase.js"></script>


  <!-- Fonctionnement de la connexion -->
  <script>

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const forgotPassword =
      document.getElementById("forgotPassword");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;


      if (!window.tasklySupabase) {

        showMessage(
          "Erreur : la connexion à Supabase n'est pas disponible.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "Connexion...";


      try {

        const result =
          await window.tasklySupabase.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (result.error) {

          showMessage(
            "Connexion impossible : " +
            result.error.message,
            "error"
          );

          button.disabled = false;
          button.textContent = "Se connecter";

          return;
        }


        if (!result.data || !result.data.user) {

          showMessage(
            "La connexion n'a pas pu être confirmée.",
            "error"
          );

          button.disabled = false;
          button.textContent = "Se connecter";

          return;
        }


        showMessage(
          "Connexion réussie ! Redirection...",
          "success"
        );


        setTimeout(function() {

          window.location.href = "dashboard.html";

        }, 500);


      } catch (error) {

        showMessage(
          "Une erreur est survenue : " +
          error.message,
          "error"
        );

        button.disabled = false;
        button.textContent = "Se connecter";

      }

    });


    forgotPassword.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value
            .trim();


        if (!email) {

          showMessage(
            "Entre d'abord ton adresse e-mail.",
            "error"
          );

          return;
        }


        if (!window.tasklySupabase) {

          showMessage(
            "Supabase n'est pas disponible.",
            "error"
          );

          return;
        }


        try {

          const result =
            await window.tasklySupabase.auth
              .resetPasswordForEmail(email, {
                redirectTo:
                  window.location.origin +
                  "/login.html"
              });


          if (result.error) {

            showMessage(
              "Erreur : " +
              result.error.message,
              "error"
            );

            return;
          }


          showMessage(
            "Un e-mail de réinitialisation a été envoyé.",
            "success"
          );


        } catch (error) {

          showMessage(
            "Erreur : " +
            error.message,
            "error"
          );

        }

      }
    );

  </script>

</body>
</html>
