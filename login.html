<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Connexion — Taskly</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f7f8fc;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      color: #15171c;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;

      font-size: 28px;
      font-weight: 800;

      margin-bottom: 30px;
    }

    .logo span {
      color: #635bff;
    }

    .card {
      background: white;

      border: 1px solid #e5e6eb;

      border-radius: 22px;

      padding: 30px;

      box-shadow:
        0 20px 60px
        rgba(25, 25, 40, 0.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      color: #70737c;

      line-height: 1.5;

      margin-bottom: 25px;
    }

    label {
      display: block;

      font-size: 14px;
      font-weight: 600;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border:
        1px solid #dfe1e7;

      border-radius: 10px;

      font-size: 15px;

      margin-bottom: 18px;

      outline: none;
    }

    input:focus {
      border-color: #635bff;
    }

    .forgot {
      display: block;

      text-align: right;

      margin-top: -8px;

      margin-bottom: 20px;

      color: #635bff;

      text-decoration: none;

      font-size: 13px;
    }

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 11px;

      background: #635bff;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      padding: 12px;

      margin-bottom: 18px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0f0;
      color: #b42318;
    }

    .message.success {
      background: #eefbf3;
      color: #16794c;
    }

    .signup {
      text-align: center;

      margin-top: 20px;

      color: #70737c;

      font-size: 14px;
    }

    .signup a {
      color: #635bff;

      text-decoration: none;

      font-weight: 700;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #70737c;

      text-decoration: none;

      font-size: 14px;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="logo">
      task<span>ly</span>
    </div>


    <div class="card">

      <h1>
        Bon retour 👋
      </h1>

      <p class="description">
        Connecte-toi à ton compte Taskly pour retrouver
        tes objectifs et ta progression.
      </p>


      <div
        id="message"
        class="message"
      ></div>


      <form id="loginForm">

        <label for="email">
          Adresse e-mail
        </label>

        <input
          id="email"
          type="email"
          placeholder="ton@email.com"
          autocomplete="email"
          required
        >


        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          placeholder="Ton mot de passe"
          autocomplete="current-password"
          required
        >


        <a
          href="#"
          id="forgotPassword"
          class="forgot"
        >
          Mot de passe oublié ?
        </a>


        <button
          id="loginButton"
          type="submit"
        >
          Se connecter
        </button>

      </form>


      <div class="signup">

        Pas encore de compte ?

        <a href="signup.html">
          Créer un compte
        </a>

      </div>


      <a
        href="index.html"
        class="back"
      >
        ← Retour à Taskly
      </a>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <script>

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        message.className = "message";


        button.disabled = true;

        button.textContent =
          "Connexion...";


        try {

          const { data, error } =
            await window.tasklySupabase.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {

            showMessage(
              error.message,
              "error"
            );

            button.disabled = false;

            button.textContent =
              "Se connecter";

            return;
          }


          if (!data.user) {

            showMessage(
              "Connexion impossible.",
              "error"
            );

            button.disabled = false;

            button.textContent =
              "Se connecter";

            return;
          }


          showMessage(
            "Connexion réussie !",
            "success"
          );


          window.location.href =
            "dashboard.html";


        } catch (error) {

          showMessage(
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Se connecter";

        }

      }
    );


    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          if (!email) {

            showMessage(
              "Entre ton adresse e-mail avant de demander un nouveau mot de passe.",
              "error"
            );

            return;
          }


          try {

            const { error } =
              await window.tasklySupabase.auth
                .resetPasswordForEmail(
                  email,
                  {
                    redirectTo:
                      window.location.origin +
                      "/login.html"
                  }
                );


            if (error) {

              showMessage(
                error.message,
                "error"
              );

              return;
            }


            showMessage(
              "Un e-mail de réinitialisation a été envoyé.",
              "success"
            );


          } catch (error) {

            showMessage(
              error.message,
              "error"
            );

          }

        }
      );

  </script>

</body>

</html>
